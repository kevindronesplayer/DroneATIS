<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DroneATIS 飛手</title>
<style>
:root{--bg:#0a0e1a;--sf:#131929;--sf2:#1c2438;--sf3:#242e45;--ac:#00d4ff;--gr:#00e676;--rd:#ff3d57;--am:#ffa726;--tx:#e8f0fe;--tx2:#8899bb;--bd:rgba(255,255,255,0.07);--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
.page{display:none;flex:1;flex-direction:column;overflow-y:auto;}
.page.active{display:flex;}
.center-page{align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px;}
.logo{font-size:28px;font-weight:700;color:var(--ac);}
.sub{font-size:17px;color:var(--tx2);}
input[type=text],input[type=number]{width:100%;max-width:320px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:var(--rs);padding:14px 16px;font-size:22px;font-family:inherit;outline:none;text-align:center;}
input[type=text]:focus,input[type=number]:focus{border-color:var(--ac);}
.btn{background:var(--ac);color:#000;border:none;border-radius:var(--rs);padding:16px 20px;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;max-width:320px;}
.btn:active{opacity:.8;}
.btn.gray{background:var(--sf3);color:var(--tx);}
.btn.red{background:var(--rd);color:#fff;}
.btn.green{background:var(--gr);color:#000;}
.btn.amber{background:var(--am);color:#000;}
.btn.outline{background:transparent;border:1px solid var(--bd);color:var(--tx2);}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;width:100%;max-width:340px;}
.mode-btn{width:100%;max-width:340px;background:var(--sf);border:2px solid var(--bd);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;}
.mode-btn .t{font-size:22px;font-weight:700;color:var(--ac);}
.mode-btn .d{font-size:15px;color:var(--tx2);margin-top:4px;}
.mode-btn.follower .t{color:var(--gr);}
.code-box{font-size:48px;font-weight:700;letter-spacing:10px;color:var(--ac);background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px 30px;}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:340px;}
.kp-btn{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:var(--rs);padding:20px 0;font-size:26px;font-weight:700;cursor:pointer;}
.kp-btn:active{background:var(--sf3);}

/* ── 主畫面 ── */
#scrMain{padding:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0;gap:10px;}
.topbar .name{font-weight:700;color:var(--ac);font-size:18px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rd);flex-shrink:0;}
.dot.on{background:var(--gr);}
.iconbtn{background:var(--sf3);border:1px solid var(--bd);color:var(--tx2);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;flex-shrink:0;}

.body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
.notam-row{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 14px;}
.notam-row .lbl{font-size:14px;color:var(--tx2);}
.notam-row .val{font-size:16px;font-weight:700;color:var(--am);flex:1;}
.notam-row input{flex:1;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:6px 8px;font-size:15px;font-family:monospace;letter-spacing:2px;outline:none;}
.meta-row{display:flex;gap:8px;font-size:13px;color:var(--ac);}
.meta-row span{background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:3px 10px;}

.status-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:26px 18px;text-align:center;flex-shrink:0;}
.status-card .headline{font-weight:700;color:var(--tx);word-break:break-word;line-height:1.35;}
.status-card .land-time{color:var(--am);font-size:20px;margin-top:8px;font-weight:700;}
.status-card .land-count{color:var(--tx2);font-size:15px;margin-top:4px;}
.status-card .land-reason{color:var(--tx);font-size:15px;margin-top:6px;}
.tag-pending{display:inline-block;margin-top:10px;background:var(--am);color:#000;font-size:13px;font-weight:700;border-radius:99px;padding:4px 12px;}

.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.action-grid .btn{max-width:none;font-size:17px;padding:16px 8px;}
.land-btn{background:var(--am);color:#000;font-weight:700;padding:18px;border-radius:var(--r);border:none;font-size:18px;width:100%;cursor:pointer;}
.readonly-banner{text-align:center;color:var(--ac);font-size:14px;padding:10px;background:var(--sf);border-radius:var(--rs);border:1px solid var(--bd);}

/* 監看：跟隨者狀態列 */
.mon-row{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;}
.mon-name{font-size:19px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mon-badge{font-size:12px;font-weight:700;border-radius:99px;padding:3px 8px;flex-shrink:0;}
.mon-badge.g{background:rgba(255,167,38,.18);color:var(--am);}
.mon-badge.v{background:var(--sf3);color:var(--tx2);}
.mon-stat{font-size:14px;font-weight:700;border-radius:99px;padding:3px 10px;flex-shrink:0;}
.mon-stat.wait{background:var(--am);color:#000;}
.mon-stat.done{background:var(--gr);color:#000;}
.mon-stat.land{background:#3d2a1a;color:var(--am);border:1px solid var(--am);}
.mon-stat.idle{background:var(--sf3);color:var(--tx2);}
.mon-empty{color:var(--tx2);text-align:center;padding:30px 10px;font-size:16px;}

.footer-actions{display:flex;gap:8px;padding:10px 14px 16px;flex-shrink:0;}
.footer-actions .btn{max-width:none;font-size:14px;padding:10px 6px;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--sf3);color:var(--tx);padding:10px 18px;border-radius:99px;font-size:15px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;border:1px solid var(--bd);max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
.toast.show{opacity:1;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--sf);border-radius:var(--r);padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;}
.modal h3{font-size:19px;color:var(--ac);text-align:center;}
.modal .row{display:flex;gap:10px;}
.modal .row .btn{flex:1;max-width:none;}
</style>
</head>
<body>

<!-- 姓名輸入 -->
<div class="page center-page active" id="scrName">
  <div class="logo">DroneATIS</div>
  <div class="sub">飛手行動裝置</div>
  <input type="text" id="nameInput" placeholder="輸入你的名字" maxlength="10">
  <button class="btn" id="btnNameNext">下一步</button>
</div>

<!-- 模式選擇 -->
<div class="page center-page" id="scrModeSelect">
  <div class="logo">DroneATIS</div>
  <div class="sub" id="modeSelName"></div>
  <div class="mode-btn follower" id="btnModeView">
    <div class="t">跟隨模式</div>
    <div class="d">跟隨主控，僅顯示、不回應</div>
  </div>
  <div class="mode-btn" id="btnModeGather" style="border-color:var(--am)">
    <div class="t" style="color:var(--am)">飛聚跟隨模式</div>
    <div class="d">跟隨主控，需回報（回報給主控者，不是塔台）</div>
  </div>
  <div class="mode-btn" id="btnModeMonitor" style="border-color:var(--tx2)">
    <div class="t" style="color:var(--tx)">看跟隨者狀態</div>
    <div class="d">看主控的跟隨者有誰、飛聚跟隨者的回報狀態</div>
  </div>
  <button class="btn outline" id="btnModeBack">‹ 更改名字</button>
</div>

<!-- 監看：跟隨者狀態 -->
<div class="page" id="scrMonitor">
  <div class="topbar">
    <div class="dot" id="monDot"></div>
    <div class="name" id="monName"></div>
    <div class="iconbtn" id="monMore">更多</div>
  </div>
  <div class="body">
    <div class="status-card" style="padding:16px">
      <div style="font-size:14px;color:var(--tx2)">主控目前狀態</div>
      <div class="headline" id="monMasterStatus" style="font-size:24px;margin-top:4px">—</div>
    </div>
    <div id="monList"></div>
  </div>
</div>

<!-- 輸入主控序號 -->
<div class="page center-page" id="scrFollowerCode">
  <div class="logo">DroneATIS</div>
  <div class="sub" id="followerCodeName"></div>
  <div class="sub">輸入主控序號（4碼，數字1-4）</div>
  <div class="code-box" id="followerBuf" style="min-width:220px">____</div>
  <div class="keypad">
    <div class="kp-btn" data-k="1">1</div><div class="kp-btn" data-k="2">2</div>
    <div class="kp-btn" data-k="3">3</div><div class="kp-btn" data-k="4">4</div>
  </div>
  <div class="row" style="display:flex;gap:10px;width:100%;max-width:340px;">
    <button class="btn gray" id="btnFollowerClr" style="max-width:none;">清除</button>
    <button class="btn" id="btnFollowerOk" style="max-width:none;">確認</button>
  </div>
  <button class="btn outline" id="btnFollowerBack">‹ 更改名字</button>
</div>

<!-- 主畫面 -->
<div class="page" id="scrMain">
  <div class="topbar">
    <div class="dot" id="connDot"></div>
    <div class="name" id="mainName"></div>
    <div class="iconbtn" id="btnMoreMenu">更多</div>
  </div>
  <div class="body">
    <div class="meta-row" id="metaRow" style="display:none;"></div>
    <div class="notam-row" id="notamRow">
      <span class="lbl">飛航公告</span>
      <span class="val" id="notamVal">未設定</span>
    </div>
    <div class="status-card">
      <div class="land-count" id="msgTimeText" style="display:none;margin:-14px 0 14px;line-height:1;"></div>
      <div class="headline" id="headlineText" style="font-size:26px;">等待塔台來訊</div>
      <div class="land-time" id="landTimeText" style="display:none;"></div>
      <div class="land-count" id="landCountText" style="display:none;"></div>
      <div class="land-reason" id="landReasonText" style="display:none;"></div>
      <div class="tag-pending" id="pendingTag" style="display:none;">等待回應</div>
    </div>
    <div id="ackWrap" style="display:none;">
      <button class="btn green" id="btnAck" style="max-width:none;">收到</button>
    </div>
    <button class="btn outline" id="btnShareLoc" style="max-width:none;font-size:15px;padding:11px;">📍 分享位置給塔台：關</button>
    <div class="readonly-banner" id="followerBanner" style="display:none;">跟隨模式 · 僅顯示</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 更多選單 -->
<div class="modal-overlay" id="moreModal">
  <div class="modal">
    <h3>更多功能</h3>
    <button class="btn outline" id="btnRename">更改名字</button>
    <button class="btn outline" id="btnBackToModeSel">重新選擇模式</button>
    <button class="btn gray" id="btnCloseMore">關閉</button>
  </div>
</div>

<!-- 改名 -->
<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h3>更改名字</h3>
    <input type="text" id="renameInput" maxlength="10">
    <div class="row"><button class="btn gray" id="btnRenameCancel">取消</button><button class="btn" id="btnRenameOk">確定</button></div>
  </div>
</div>

<script>
// ── 狀態 ──────────────────────────────────────────────────────────────
// 網頁版只有兩種跟隨角色，沒有主控模式
let ws=null, wsConnecting=false, wsConnected=false;
let followerKind='view';   // 'view'=跟隨 / 'gather'=飛聚跟隨 / 'monitor'=看跟隨者狀態
let gatherMode=false;      // followerKind==='gather'
let monitorMode=false;     // followerKind==='monitor'
let connected=false;       // 是否已進入主畫面（取代舊的 pilotMode 判斷）
let lastNagAt=0;
let pilotName=localStorage.getItem('pilotName')||'';
let clientId='', roomCode='', masterCode='';
let towerConnected=false, towerName='塔台', towerTypeStr='南塔', groupName='';
let notamCode='', rwyDir='';
let currentStatus='開機預備', lastMessage='', lastMessageTime='', showingMessage=false, everReceivedCommand=false;
let landingTimeStr='', landingReason='';
let ackPending=false, ackDeadline=0;
let landState='none'; // none | wait_ack | countdown
let immEndSec=null;   // 馬上降落：絕對倒數截止秒（當天秒數）
let heartbeatTimer=null, clockTimer=null, reconnectTimer=null;

function $(id){return document.getElementById(id);}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');}
function showModal(id){$(id).classList.add('show');}
function hideModal(id){$(id).classList.remove('show');}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2500);}

// ── WebSocket ────────────────────────────────────────────────────────
function send(d){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(d)); }

function connect(){
  if(wsConnecting||wsConnected) return;
  wsConnecting=true;
  const wsProtocol = location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(`${wsProtocol}//${location.host}`);
  ws.onopen=()=>{
    wsConnecting=false; wsConnected=true; updateConnDot();
    send({type:'follower_register',name:pilotName,masterCode,gather:gatherMode,monitor:monitorMode});
  };
  ws.onclose=()=>{ wsConnecting=false; wsConnected=false; updateConnDot(); scheduleReconnect(); };
  ws.onerror=()=>{ try{ws.close();}catch(e){} };
  ws.onmessage=e=>{ let msg; try{msg=JSON.parse(e.data);}catch(err){return;} handle(msg); };
}
function scheduleReconnect(){
  clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(()=>{ if(masterCode) connect(); },4000);
}
function updateConnDot(){
  $('connDot').classList.toggle('on', wsConnected);
  $('monDot').classList.toggle('on', wsConnected);
}
function getBattery(){
  return 100; // 網頁版無法讀取硬體電量，固定回報100
}

// ── 訊息處理 ─────────────────────────────────────────────────────────
function handle(msg){
  switch(msg.type){
    case 'monitor_registered':
      towerConnected=true; towerName=msg.towerName||'塔台'; towerTypeStr=msg.towerType||'南塔';
      $('monName').textContent=(msg.masterName||'主控')+' 的跟隨者';
      showPage('scrMonitor'); updateConnDot();
      startHeartbeat();
      break;
    case 'monitor_followers':
      renderMonitor(msg);
      break;
    case 'tower_info': // 塔台改南北塔或名字
      towerName=msg.towerName||towerName; towerTypeStr=msg.towerType||towerTypeStr;
      if(document.getElementById('scrMain').classList.contains('active')) renderMain();
      break;
    case 'follower_registered':
      clientId=msg.clientId; towerConnected=true;
      groupName=msg.groupName||''; towerName=msg.towerName||'塔台'; towerTypeStr=msg.towerType||'南塔';
      notamCode=msg.notam||''; rwyDir=msg.rwy||'';
      currentStatus=msg.status||'開機預備';
      immEndSec=null;
      applyLandingTime(msg.landingTime);
      lastMessageTime=msg.lastMessageTime||''; // 上次塔台來訊時間（指令或訊息）
      if(msg.lastCommType==='message'){ lastMessage=msg.lastMessage||''; showingMessage=!!lastMessage; }
      else showingMessage=false;
      everReceivedCommand=!!msg.hasCommand;
      // 主控已回報降落完成 → 晚加入的跟隨者直接看「降落＋時間」，不進回報流程
      if(msg.landDone){ landState='none'; }
      else {
        landState=(currentStatus==='降落')?'wait_ack':'none';
        if(gatherMode && (everReceivedCommand || showingMessage)){ ackPending=true; ackDeadline=Date.now()+30000; lastNagAt=Date.now(); }
      }
      enterMain();
      break;
    case 'follower_error':
      showToast('⚠️ '+(msg.message||'序號無效或已過期'));
      break;
    case 'tower_connected':
      towerConnected=true;
      groupName=msg.groupName||''; towerName=msg.towerName||'塔台'; towerTypeStr=msg.towerType||'南塔';
      enterMain();
      break;
    case 'command': case 'follower_sync':
      showingMessage=false; everReceivedCommand=true;
      currentStatus=msg.status;
      lastMessageTime=msg.time||nowClock(); // 塔台這次來訊的時間（指令也要顯示，跟 line 一樣）
      if(msg.immediate){
        // 馬上降落：從收到指令當下起算，剛好倒數 1 分鐘
        immEndSec=(getNowTotalSecs()+60)%86400;
        landingTimeStr=String(Math.floor(immEndSec/3600)).padStart(2,'0')+String(Math.floor(immEndSec/60)%60).padStart(2,'0');
        landingReason='';
      } else { immEndSec=null; applyLandingTime(msg.landingTime); }
      if(msg.groupName!==undefined && msg.groupName!=='') groupName=msg.groupName;
      landState=(currentStatus==='降落')?'wait_ack':'none';
      if(gatherMode){ ackPending=true; ackDeadline=Date.now()+30000; lastNagAt=Date.now(); }
      renderMain(); beep(880); vibrate();
      break;
    case 'message':
      showingMessage=true; everReceivedCommand=true;
      lastMessage=msg.message; lastMessageTime=msg.time||nowClock(); landState='none';
      if(gatherMode){ ackPending=true; ackDeadline=Date.now()+30000; lastNagAt=Date.now(); }
      renderMain(); beep(660); vibrate();
      break;
    case 'group_update':
      groupName=msg.groupName||''; if(msg.towerName) towerName=msg.towerName;
      renderMain();
      break;
    case 'rwy_update':
      rwyDir=msg.rwy||''; showToast('✈ 跑道改 '+rwyDir); renderMain();
      break;
    case 'notam_update':
      notamCode=msg.notam||''; renderMain();
      break;
    case 'ack_overdue':
      break;
    case 'follower_ack_sync':
      if(gatherMode) break; // 飛聚跟隨自己管理回報狀態，忽略主控的回報同步
      if(msg.ackType==='ack'||msg.ackType==='takeoff'){ landState='none'; }
      else if(msg.ackType==='landing_ack'){ landState='countdown'; }
      else if(msg.ackType==='landing_done'){ landState='none'; }
      renderMain();
      break;
    case 'pilot_notam_update':
      // 塔台可能由其他來源更新（正常情況這裡不會收到自己那份，安全略過）
      break;
    case 'session_ended':
      showToast('已通知塔台'); ackPending=false; renderMain();
      break;
  }
}

function nowClock(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

// 降落流程中不讓螢幕休眠
let _wakeLock=null;
async function updateWakeLock(){
  const want = currentStatus==='降落' && !!landingTimeStr && !showingMessage;
  try{
    if(want && !_wakeLock && ('wakeLock' in navigator)){
      _wakeLock=await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release',()=>{ _wakeLock=null; });
    } else if(!want && _wakeLock){
      const w=_wakeLock; _wakeLock=null; w.release();
    }
  }catch(e){ _wakeLock=null; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') updateWakeLock(); });
function applyLandingTime(raw){
  landingReason='';
  if(!raw){ landingTimeStr=''; return; }
  const s=String(raw);
  if(s.length>=4 && /^\d{4}/.test(s)){
    landingTimeStr=s.slice(0,4);
    if(s.length>4) landingReason=s.slice(4);
  } else landingTimeStr=s;
}
function getNowTotalSecs(){ const d=new Date(); return d.getHours()*3600+d.getMinutes()*60+d.getSeconds(); }
function landTimeSecs(){
  if(immEndSec!=null) return immEndSec; // 馬上降落：固定截止秒
  // 輸入 HHMM 代表「要在 HH:MM 前完成降落」，故截止點為 HH:(MM-1):59
  if(!landingTimeStr||landingTimeStr.length<4) return 0;
  const lh=parseInt(landingTimeStr.slice(0,2),10), lm=parseInt(landingTimeStr.slice(2,4),10);
  let s=lh*3600+lm*60-1; if(s<0) s+=86400; return s;
}
function getLandTimeDisplay(){
  if(!landingTimeStr||landingTimeStr.length<4) return '';
  return landingTimeStr.slice(0,2)+':'+landingTimeStr.slice(2,4);
}

// ── 畫面切換 ─────────────────────────────────────────────────────────
function enterMain(){
  connected=true;
  $('mainName').textContent=pilotName;
  $('followerBanner').style.display='block';
  $('followerBanner').textContent = gatherMode ? '飛聚跟隨模式 · 收到指令須回報主控' : '跟隨模式 · 僅顯示';
  showPage('scrMain');
  if(shareLoc) startGeo();
  updateShareLocBtn();
  renderMain();
  startHeartbeat();
  if(!clockTimer) clockTimer=setInterval(()=>{ renderCountdown(); gatherNag(); },1000);
}

// 飛聚跟隨模式：收到指令超過約10秒未回報就持續提醒
function gatherNag(){
  if(!gatherMode || !ackPending) return;
  const now=Date.now();
  if(now > ackDeadline-20000 && now-lastNagAt>8000){ beep(440); vibrate(); lastNagAt=now; }
}

function renderMain(){
  updateConnDot();
  $('notamVal').textContent = notamCode || '未設定';
  $('notamVal').style.color = notamCode ? 'var(--am)' : 'var(--tx2)';

  const metaBits=[];
  if(towerConnected) metaBits.push((towerTypeStr||'')+' '+(towerName||'塔台'));
  if(groupName) metaBits.push('['+groupName+']');
  if(rwyDir) metaBits.push(rwyDir);
  if(metaBits.length){ $('metaRow').style.display='flex'; $('metaRow').innerHTML=metaBits.map(b=>`<span>${escapeHtml(b)}</span>`).join(''); }
  else $('metaRow').style.display='none';

  const headline=$('headlineText'), landTimeEl=$('landTimeText'), landCountEl=$('landCountText'), landReasonEl=$('landReasonText'), msgTimeEl=$('msgTimeText');
  landTimeEl.style.display='none'; landCountEl.style.display='none'; landReasonEl.style.display='none'; msgTimeEl.style.display='none';

  if(showingMessage && lastMessage){
    headline.textContent=lastMessage;
    headline.style.fontSize = lastMessage.length>40 ? '17px' : (lastMessage.length>20 ? '20px' : '24px');
    headline.style.color='var(--tx)';
  } else if(!everReceivedCommand){
    headline.textContent='等待塔台來訊'; headline.style.fontSize='20px'; headline.style.color='var(--tx2)';
  } else if(currentStatus==='降落' && landingTimeStr){
    // 只留「降落 + 時間」一行，字放大
    headline.textContent='降落 '+getLandTimeDisplay();
    headline.style.fontSize='36px'; headline.style.color='var(--am)';
    landCountEl.style.display='block';
    if(landingReason){ landReasonEl.style.display='block'; landReasonEl.textContent=landingReason; }
  } else {
    headline.textContent=currentStatus;
    headline.style.fontSize = currentStatus.length>12 ? '20px' : '28px';
    headline.style.color = currentStatus==='可以起飛' ? 'var(--gr)' : 'var(--tx)';
  }
  // 塔台每次來訊（指令或訊息）都顯示發送時間，跟 line 一樣
  if(everReceivedCommand && lastMessageTime){
    msgTimeEl.style.display='block'; msgTimeEl.textContent='塔台 '+lastMessageTime+' 發送';
  }
  updateWakeLock();

  // 只有飛聚跟隨模式要回報
  $('pendingTag').style.display = (gatherMode&&ackPending) ? 'inline-block' : 'none';
  // 待回應時、或降落倒數中（還要按「降落完成」）都要保留按鈕
  $('ackWrap').style.display = (gatherMode && (ackPending || landState==='countdown')) ? 'block' : 'none';
  $('btnAck').textContent = landState==='countdown' ? '降落完成' : (landState==='wait_ack' ? '收到降落指令' : '收到');

  renderCountdown();
}

function renderCountdown(){
  if(!(currentStatus==='降落' && landingTimeStr && !showingMessage && everReceivedCommand)){ $('landCountText').style.display='none'; return; }
  let diff=landTimeSecs()-getNowTotalSecs();
  if(diff<-43200) diff+=86400; // 跨午夜
  const el=$('landCountText'); el.style.display='block';
  if(diff>0){
    const mm=String(Math.floor(diff/60)).padStart(2,'0'), ss=String(diff%60).padStart(2,'0');
    el.textContent='還有 '+mm+':'+ss; el.style.color = diff<60 ? 'var(--rd)' : 'var(--tx2)';
  } else { el.textContent='降落時間到！'; el.style.color='var(--rd)'; }
}

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── 監看：主控的跟隨者狀態 ──────────────────────────────────────────
function renderMonitor(msg){
  const ms=(msg.lastCommType==='message'&&msg.lastMessage)?('訊息：'+msg.lastMessage)
    :(msg.hasCommand?(msg.masterStatus||'開機預備'):'等待塔台來訊');
  $('monMasterStatus').textContent=ms + (msg.landingTime?(' '+String(msg.landingTime).slice(0,4).replace(/(\d\d)(\d\d)/,'$1:$2')):'');
  const fs=msg.followers||[];
  const el=$('monList');
  if(!fs.length){ el.innerHTML='<div class="mon-empty">目前沒有人跟隨這位主控</div>'; return; }
  el.innerHTML=fs.map(f=>{
    let cls='idle', txt='—';
    if(!f.gather){ cls='idle'; txt='僅顯示'; }
    else if(f.pending){ cls='wait'; txt='待回應'; }
    else if(f.stage==='landing_ack'){ cls='land'; txt='收到降落指令'; }
    else if(f.stage==='landing_done'){ cls='done'; txt='已降落'; }
    else if(f.stage==='takeoff'){ cls='done'; txt='已起飛'; }
    else if(f.stage==='ack'){ cls='done'; txt='已收到'; }
    return `<div class="mon-row">
      <span class="mon-name">${escapeHtml(f.name)}</span>
      <span class="mon-badge ${f.gather?'g':'v'}">${f.gather?'飛聚跟隨':'跟隨'}</span>
      <span class="mon-stat ${cls}">${txt}</span>
    </div>`;
  }).join('');
}

// ── 心跳 ─────────────────────────────────────────────────────────────
function startHeartbeat(){
  clearInterval(heartbeatTimer);
  sendHeartbeat();
  heartbeatTimer=setInterval(sendHeartbeat,5000);
}
function sendHeartbeat(){
  if(!wsConnected) return;
  if(shareLoc && geoLat!=null) send({type:'pilot_update',battery:getBattery(),wifi:true,gps:true,lat:geoLat,lng:geoLng});
  else send({type:'pilot_update',battery:getBattery(),wifi:true,gps:shareLoc?'searching':false});
}

// ── 分享位置給塔台 ─────────────────────────────────────────────────
let shareLoc=(localStorage.getItem('shareLoc')==='1'), geoWatch=null, geoLat=null, geoLng=null;
function updateShareLocBtn(){
  const b=$('btnShareLoc'); if(!b) return;
  b.textContent='📍 分享位置給塔台：'+(shareLoc?(geoLat!=null?'開':'定位中…'):'關');
  b.classList.toggle('green', shareLoc && geoLat!=null);
}
function startGeo(){
  if(geoWatch!=null || !navigator.geolocation) return;
  geoWatch=navigator.geolocation.watchPosition(
    pos=>{ geoLat=pos.coords.latitude; geoLng=pos.coords.longitude; updateShareLocBtn(); sendHeartbeat(); },
    err=>{ showToast('定位失敗：'+err.message); },
    {enableHighAccuracy:true,maximumAge:8000,timeout:15000});
}
function stopGeo(){ if(geoWatch!=null){ navigator.geolocation.clearWatch(geoWatch); geoWatch=null; } geoLat=geoLng=null; }
function toggleShareLoc(){
  shareLoc=!shareLoc; localStorage.setItem('shareLoc', shareLoc?'1':'0');
  if(shareLoc){ if(!navigator.geolocation){ showToast('此裝置不支援定位'); shareLoc=false; } else startGeo(); }
  else stopGeo();
  updateShareLocBtn(); sendHeartbeat();
}

// ── 蜂鳴/震動（網頁版沒有實體喇叭，用短音效+震動代替） ──────────────
let audioCtx=null;
function beep(freq){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15,audioCtx.currentTime);
    o.start(); o.stop(audioCtx.currentTime+0.18);
  }catch(e){}
}
function vibrate(){ if(navigator.vibrate) navigator.vibrate(200); }

// ── 事件綁定：姓名/模式選擇 ──────────────────────────────────────────
if(pilotName){ $('nameInput').value=pilotName; }
function showModeSelect(){
  $('modeSelName').textContent=pilotName;
  showPage('scrModeSelect');
}
function gotoFollowerCode(){
  followerBuf=''; renderFollowerBuf();
  $('followerCodeName').textContent=pilotName;
  showPage('scrFollowerCode');
}
$('btnNameNext').addEventListener('click',()=>{
  const v=$('nameInput').value.trim();
  if(!v){ showToast('請輸入名字'); return; }
  pilotName=v; localStorage.setItem('pilotName',pilotName);
  showModeSelect();
});
$('btnModeView').addEventListener('click',()=>{ followerKind='view'; gatherMode=false; monitorMode=false; gotoFollowerCode(); });
$('btnModeGather').addEventListener('click',()=>{ followerKind='gather'; gatherMode=true; monitorMode=false; gotoFollowerCode(); });
$('btnModeMonitor').addEventListener('click',()=>{ followerKind='monitor'; gatherMode=false; monitorMode=true; gotoFollowerCode(); });
$('btnModeBack').addEventListener('click',()=>{ showPage('scrName'); });
$('btnFollowerBack').addEventListener('click',()=>{ showModeSelect(); });

let followerBuf='';
function renderFollowerBuf(){ $('followerBuf').textContent=(followerBuf+'____').slice(0,4).split('').join(''); }
document.querySelectorAll('#scrFollowerCode .kp-btn').forEach(b=>b.addEventListener('click',()=>{
  if(followerBuf.length<4){ followerBuf+=b.dataset.k; renderFollowerBuf(); }
}));
$('btnFollowerClr').addEventListener('click',()=>{ followerBuf=''; renderFollowerBuf(); });
$('btnFollowerOk').addEventListener('click',()=>{
  if(followerBuf.length!==4){ showToast('請輸入4碼序號'); return; }
  masterCode=followerBuf; connect();
});

// ── 事件綁定：主畫面 ─────────────────────────────────────────────────
$('btnShareLoc').addEventListener('click',toggleShareLoc);
$('btnMoreMenu').addEventListener('click',()=>showModal('moreModal'));
$('monMore').addEventListener('click',()=>showModal('moreModal'));
$('btnCloseMore').addEventListener('click',()=>hideModal('moreModal'));
$('btnBackToModeSel').addEventListener('click',()=>{
  hideModal('moreModal');
  if(ws){ try{ws.close();}catch(e){} }
  clearInterval(heartbeatTimer); clearTimeout(reconnectTimer);
  connected=false; masterCode=''; towerConnected=false; wsConnected=false; ackPending=false;
  monitorMode=false; gatherMode=false;
  showModeSelect();
});
$('btnRename').addEventListener('click',()=>{ hideModal('moreModal'); $('renameInput').value=pilotName; showModal('renameModal'); });
$('btnRenameCancel').addEventListener('click',()=>hideModal('renameModal'));
$('btnRenameOk').addEventListener('click',()=>{
  const v=$('renameInput').value.trim();
  if(!v) return;
  pilotName=v; localStorage.setItem('pilotName',pilotName);
  send({type:'follower_rename', name:pilotName});
  $('mainName').textContent=pilotName;
  hideModal('renameModal');
});

// 收到 / 降落完成（飛聚跟隨模式：回報給主控者）
function reportAck(stage){
  send({type:'follower_confirm',stage});
}
$('btnAck').addEventListener('click',()=>{
  if(landState==='wait_ack'){
    reportAck('landing_ack'); ackPending=false; landState='countdown'; renderMain();
    if(gatherMode) showToast('已回報主控：收到降落指令');
  } else if(landState==='countdown'){
    reportAck('landing_done'); ackPending=false; landState='none';
    showingMessage=false; renderMain(); showToast(gatherMode?'已回報主控：降落完成':'已回報降落完成');
  } else {
    reportAck(currentStatus==='可以起飛' ? 'takeoff' : 'ack');
    ackPending=false; renderMain(); if(gatherMode) showToast('已回報主控');
  }
});

// ── 啟動：若先前已輸入過名字，直接到模式選擇 ──────────────────────────
if(pilotName){ showModeSelect(); }

// 分頁切到背景時仍嘗試維持連線；回到前景時如果斷線就重連
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && masterCode && !wsConnected && !wsConnecting) connect();
});
</script>
